spring.application.name=ticketing_service

spring.datasource.url=jdbc:postgresql://localhost:5432/ticketing_system
spring.datasource.username=postgres
spring.datasource.password=1234

# Flyway owns the schema; Hibernate only checks that entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.mvc.problemdetails.enabled=true

# Admin account created at startup if missing (dev defaults; change outside local development)
app.admin.email=admin@ticketing.local
app.admin.password=admin12345
