spring.application.name=ticketing_service_backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/ticketing_service}
spring.datasource.username=${DB_USERNAME:ticketing}
spring.datasource.password=${DB_PASSWORD:ticketing_local}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
