spring.application.name=ticketing_service_backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ticketing_service}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

management.endpoints.web.base-path=/api
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Local development default; override with JWT_SECRET outside local development.
app.jwt.secret=${JWT_SECRET:ticketing-local-development-jwt-signing-secret-2026}
app.jwt.ttl-seconds=${JWT_TTL_SECONDS:3600}
app.admin.enabled=${ADMIN_ENABLED:false}
app.admin.email=${ADMIN_EMAIL:admin@email.com}
app.admin.password=${ADMIN_PASSWORD:admin@123}
